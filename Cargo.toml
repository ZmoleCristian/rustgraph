[package]
name = "rustgraph"
version = "0.8.3"
edition = "2024"
authors = ["Zmole Cristian"]
description = "Rust code navigation built for AiDX — AST-aware, MCP-native, token-efficient."
license = "0BSD"
repository = "https://github.com/ZmoleCristian/rustgraph"
readme = "README.md"
keywords = ["aidx", "mcp", "call-graph", "ast", "code-navigation"]
categories = ["development-tools", "command-line-utilities", "parsing"]

[lib]
name = "rustgraph"
path = "src/lib.rs"

[[bin]]
name = "rustgraph"
path = "src/main.rs"
required-features = ["cli", "mcp"]

[features]
default = ["cli", "mcp"]
# Clap-derived CLI structs plus the app dispatch/render layer.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:libc"]
# MCP stdio server and AI-client self-registration.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio", "dep:anyhow", "dep:toml_edit", "dep:dirs"]

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
clap = { version = "4.5", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
regex = "1.10"
colored = "3"
libc = { version = "0.2", optional = true }
url = "2.5"
tracing = "0.1"
rmcp = { version = "0.8", features = ["server", "transport-io", "macros", "schemars"], optional = true }
schemars = { version = "1.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"], optional = true }
anyhow = { version = "1", optional = true }
toml_edit = { version = "0.22", optional = true }
dirs = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3.13"
