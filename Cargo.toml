[package]
name = "rustgraph"
version = "0.8.1"
edition = "2024"
authors = ["Zmole Cristian"]
description = "Rust code navigation built for AiDX — AST-aware, MCP-native, token-efficient."
license = "0BSD"
repository = "https://github.com/ZmoleCristian/rustgraph"
readme = "README.md"
keywords = ["aidx", "mcp", "call-graph", "ast", "code-navigation"]
categories = ["development-tools", "command-line-utilities", "parsing"]

[lib]
name = "rustgraph"
path = "src/lib.rs"

[[bin]]
name = "rustgraph"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
regex = "1.10"
colored = "3"
libc = "0.2"
url = "2.5"
tracing = "0.1"
rmcp = { version = "0.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
anyhow = "1"
toml_edit = "0.22"
dirs = "6"

[dev-dependencies]
tempfile = "3.13"
